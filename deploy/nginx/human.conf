# Mori Classroom · https://pkusi.com/human/ — included inside the existing pkusi server block
# (one line: include /etc/nginx/snippets/human.conf;). Only /human paths are matched; the root site is untouched.
# Node service (systemd human-api) listens on 127.0.0.1:8318 and serves both the SPA and /human/api.
location = /human { absolute_redirect off; return 308 /human/; }

location ^~ /human/api/ {
    proxy_pass http://127.0.0.1:8318;           # 保留 /human/api 前缀（服务以 BASE_PATH=/human 运行）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;                        # SSE 逐段下发
    proxy_cache off;
    proxy_read_timeout 60s;                     # 应用超时 30s + 余量
    client_max_body_size 64k;
    add_header X-Accel-Buffering no always;
    add_header Cache-Control "no-store" always;
}

location ^~ /human/ {
    proxy_pass http://127.0.0.1:8318;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
}
